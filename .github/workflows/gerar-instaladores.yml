# Gera o app portátil do Windows (.exe) e o app do Android (.apk) na nuvem do GitHub.
# Como usar: aba "Actions" do repositório → "Gerar instaladores" → "Run workflow".
# Ao terminar, baixe os arquivos em "Artifacts" no fim da página da execução.
name: Gerar instaladores

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  windows:
    name: Windows (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependências
        run: npm install
      - name: Gerar instalador e versão portátil
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Gerar versão Windows Admin
        run: npm run dist:win:admin
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: Caderno-R1-Windows
          path: |
            dist/*.exe
            dist-admin/*.exe
          if-no-files-found: error

  android:
    name: Android (.apk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar dependências
        run: npm install
      - name: Criar projeto Android
        run: |
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#1F3A4D' --iconBackgroundColorDark '#1F3A4D' --splashBackgroundColor '#F1F5F7' --splashBackgroundColorDark '#12191E'
          npx cap sync android
      - name: Assinar sempre com a mesma chave (permite instalar por cima da versão anterior)
        run: |
          mkdir -p ~/.android
          cp android-debug.keystore ~/.android/debug.keystore
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          grep -n versionCode android/app/build.gradle
      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Renomear APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Caderno-R1.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Caderno-R1-Android
          path: Caderno-R1.apk
          if-no-files-found: error
